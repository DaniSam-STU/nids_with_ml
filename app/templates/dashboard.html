<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NIDS Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <span class="navbar-brand">🛡 ML-Based NIDS Dashboard</span>
    </div>
</nav>

<div class="container mt-4">

    <div class="alert alert-success">
        <h5>🖥 System IP Address</h5>
        <strong>{{ user_ip }}</strong><br>
        Monitoring traffic for this system
    </div>

    <div class="card mb-4">
        <div class="card-header bg-primary text-white">
            📡 Real-Time Network Traffic
        </div>
        <div class="card-body">
            <p><strong>Packets:</strong> <span id="packets">--</span></p>
            <p><strong>Bytes:</strong> <span id="bytes">--</span></p>
            <p><strong>Last Update:</strong> <span id="time">--</span></p>
        </div>
    </div>

    <canvas id="trafficChart" height="100"></canvas>

    <div class="row text-center mt-4">
        <div class="col">
            <h4 id="attacks">0</h4>
            <small>Attacks Detected</small>
        </div>
    </div>

    <div class="card mt-4">
        <div class="card-header bg-danger text-white">
            🚨 Recent Live Detections
        </div>
        <div class="card-body" id="detections">
            <p class="text-muted">No detections yet</p>
        </div>
    </div>

</div>

<script>
const ctx = document.getElementById("trafficChart").getContext("2d");
const chart = new Chart(ctx, {
    type: "line",
    data: {
        labels: [],
        datasets: [
            { label: "Packets Received/sec", data: [], borderWidth: 2 },
            { label: "Packets Sent/sec", data: [], borderWidth: 2 }
        ]
    }
});

setInterval(() => {
    fetch("/api/live")
        .then(res => res.json())
        .then(data => {

            document.getElementById("packets").innerText =
                data.stats.packets_recv + " recv / " + data.stats.packets_sent + " sent";

            document.getElementById("bytes").innerText =
                data.stats.bytes_recv + " recv / " + data.stats.bytes_sent + " sent";

            document.getElementById("time").innerText = data.stats.timestamp;
            document.getElementById("attacks").innerText = data.attacks;

            chart.data.labels.push(data.stats.timestamp);
            chart.data.datasets[0].data.push(data.stats.packets_recv);
            chart.data.datasets[1].data.push(data.stats.packets_sent);

            if (chart.data.labels.length > 10) {
                chart.data.labels.shift();
                chart.data.datasets.forEach(d => d.data.shift());
            }
            chart.update();

            const box = document.getElementById("detections");
            box.innerHTML = "";
            if (data.detections.length === 0) {
                box.innerHTML = "<p class='text-muted'>No detections yet</p>";
            } else {
                data.detections.forEach(d => {
                    box.innerHTML += `
                        <div class="alert alert-danger">
                            <strong>${d.type}</strong><br>
                            Confidence: ${d.confidence}%<br>
                            Time: ${d.time}
                        </div>
                    `;
                });
            }
        });
}, 2000);
</script>

</body>
</html>
